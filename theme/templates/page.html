{% extends "base.html" %}

{% block title %}
  {{ page.title }} | {{ SITENAME }}
{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/document.css" />
{% endblock %}

{% block content %}
  <article class="doc-page">
    <div class="doc-main">
      <div class="doc-content">
        <header class="doc-header">
          <h1 class="doc-title">{{ page.title }}</h1>

          {% if page.updated %}
            <p class="doc-updated">
              עודכן לאחרונה: {{ page.updated }}
            </p>
          {% endif %}
        </header>

        {{ page.content }}
      </div>
    </div>
  </article>
{% endblock %}
